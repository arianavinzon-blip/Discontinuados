<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Divisor de plan de compras</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root{
    --bg:#f6f5f2;
    --panel:#ffffff;
    --ink:#1c2a24;
    --ink-soft:#5b6b63;
    --line:#dde2de;
    --accent:#1f6f54;
    --accent-soft:#e6f2ec;
    --warn:#a3441f;
    --warn-soft:#fbe9e1;
    --info-soft:#eef3fb;
    --info:#2a527a;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  #app-root{
    font-family:'Segoe UI', Arial, sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding:28px;
    border-radius:12px;
    max-width:760px;
    margin:24px auto;
  }
  h1{
    font-size:20px;
    margin:0 0 4px 0;
    letter-spacing:.2px;
  }
  .subtitle{
    color:var(--ink-soft);
    font-size:13.5px;
    margin:0 0 22px 0;
  }
  .dropzone{
    border:2px dashed var(--line);
    border-radius:10px;
    background:var(--panel);
    padding:36px 20px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .dropzone.drag{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .dropzone p{margin:6px 0;}
  .dropzone .main-label{font-size:14.5px; font-weight:600;}
  .dropzone .sub-label{font-size:12.5px; color:var(--ink-soft);}
  input[type=file]{display:none;}

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:20px;
    margin-top:16px;
  }
  .panel h2{
    font-size:14px;
    margin:0 0 12px 0;
    display:flex;
    align-items:center;
    gap:8px;
    word-break:break-all;
  }
  .row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding:8px 0;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
  }
  .row:last-child{border-bottom:none;}
  .row .row-label{flex:1;}
  select, input[type=text]{
    font-size:13.5px;
    padding:6px 10px;
    border-radius:6px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    max-width:60%;
  }
  input[type=text]{min-width:200px;}
  table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
    margin-top:4px;
  }
  th,td{
    text-align:left;
    padding:6px 8px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  th{color:var(--ink-soft); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em;}
  .table-scroll{overflow-x:auto; margin-top:8px;}
  .pill{
    display:inline-block;
    background:var(--accent-soft);
    color:var(--accent);
    border-radius:20px;
    padding:2px 10px;
    font-size:12px;
    font-weight:600;
  }
  button.primary{
    margin-top:18px;
    background:var(--accent);
    color:#fff;
    border:none;
    padding:11px 18px;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    width:100%;
  }
  button.primary:disabled{
    background:#a9b8b0;
    cursor:not-allowed;
  }
  button.primary:hover:not(:disabled){filter:brightness(1.05);}
  button.link-btn{
    background:none;
    border:1px solid var(--line);
    border-radius:6px;
    padding:5px 10px;
    font-size:12.5px;
    color:var(--accent);
    cursor:pointer;
  }
  button.link-btn:hover{background:var(--accent-soft);}
  .status{
    font-size:13px;
    margin-top:10px;
    color:var(--ink-soft);
  }
  .status.ok{color:var(--accent); font-weight:600;}
  .status.err{color:var(--warn); font-weight:600;}
  .warn-box{
    background:var(--warn-soft);
    color:var(--warn);
    border-radius:8px;
    padding:10px 12px;
    font-size:13px;
    margin-top:10px;
  }
  .info-box{
    background:var(--info-soft);
    color:var(--info);
    border-radius:8px;
    padding:10px 12px;
    font-size:12.5px;
    margin-top:10px;
    line-height:1.5;
  }
  .reset-link{
    display:inline-block;
    margin-top:14px;
    font-size:12.5px;
    color:var(--ink-soft);
    cursor:pointer;
    text-decoration:underline;
  }
  .progress-wrap{
    margin-top:14px;
  }
  .progress-track{
    background:var(--line);
    border-radius:20px;
    height:10px;
    overflow:hidden;
  }
  .progress-bar{
    background:var(--accent);
    height:100%;
    transition:width .2s;
  }
  .progress-label{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:6px;
  }
  .spinner{
    display:inline-block;
    width:16px;height:16px;
    border:2px solid var(--line);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin .7s linear infinite;
    vertical-align:middle;
    margin-right:8px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .field-group{
    padding:8px 0;
    border-bottom:1px solid var(--line);
  }
  .field-group .fg-label{font-size:13.5px; margin-bottom:6px; display:block;}
  .field-group .fg-hint{font-size:12px; color:var(--ink-soft); margin-top:4px;}
  .field-group input[type=text]{max-width:100%; width:100%;}
  .preview-box{
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px;
    margin-top:12px;
  }
  .preview-box h3{font-size:13px; margin:0 0 6px 0;}
  .col-checks{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  .col-check{
    display:flex; align-items:center; gap:6px;
    font-size:12.5px;
    background:var(--accent-soft); color:var(--accent);
    border:1px solid var(--line); border-radius:6px;
    padding:5px 9px; cursor:pointer; user-select:none;
  }
  .col-check.off{background:#efedea; color:var(--ink-soft); text-decoration:line-through;}
  .col-check input{margin:0; cursor:pointer;}
  tr.row-off td{color:var(--ink-soft); text-decoration:line-through; opacity:.7;}
  tr.row-off td .pill{opacity:.6;}
  .mini-link{color:var(--accent); cursor:pointer; text-decoration:underline;}
  .mini-link:hover{filter:brightness(1.1);}
</style>
</head>
<body>
<div id="app-root"></div>
<script type="text/babel" data-presets="react">
const {useState, useRef} = React;

// Palabras que suelen dar nombre a la columna de país / compañía.
// Se comparan sin acentos ni mayúsculas.
const CANDIDATE_HEADERS = [
  "pais", "país", "compania", "compañia", "compañía", "company",
  "filial", "empresa", "cliente", "sucursal"
];

// Cuántas filas del arranque miramos buscando el encabezado.
const HEADER_SEARCH_LIMIT = 12;
// A partir de cuántas filas consideramos el archivo "grande" y mostramos progreso.
const LARGE_FILE_THRESHOLD = 2000;

function normalize(str){
  return (str ?? "")
    .toString()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "") // saca acentos
    .trim()
    .toLowerCase();
}

// Convierte cualquier valor de celda en algo legible para la vista previa.
function displayValue(v){
  if(v === null || v === undefined) return "";
  if(v instanceof Date) return v.toLocaleDateString();
  if(typeof v === "object"){
    if("result" in v) return displayValue(v.result);          // fórmula: mostramos su resultado
    if("text" in v) return v.text;                            // texto enriquecido / hipervínculo
    if("richText" in v) return v.richText.map(t => t.text).join("");
    return "";
  }
  return v.toString();
}

// ----- utilidades para celdas combinadas (merged cells) -----
function colLetterToNum(letters){
  let n = 0;
  for(const ch of letters.toUpperCase()) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n;
}
function numToColLetter(n){
  let s = "";
  while(n > 0){ const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
  return s;
}
function parseAddr(addr){
  const m = addr.match(/([A-Za-z]+)(\d+)/);
  if(!m) return null;
  return {col: colLetterToNum(m[1]), row: parseInt(m[2], 10)};
}
function parseRange(range){
  const parts = range.split(":");
  const p1 = parseAddr(parts[0]);
  const p2 = parts[1] ? parseAddr(parts[1]) : p1;
  if(!p1 || !p2) return null;
  return {
    top: Math.min(p1.row, p2.row),
    bottom: Math.max(p1.row, p2.row),
    left: Math.min(p1.col, p2.col),
    right: Math.max(p1.col, p2.col),
  };
}
function rangeStr(top, left, bottom, right){
  return `${numToColLetter(left)}${top}:${numToColLetter(right)}${bottom}`;
}

// Reescribe las referencias de una fórmula (A1, $A$1, rangos A1:B2) a la nueva
// ubicación de los datos en el archivo separado. rowMap: fila original -> fila
// nueva; colMap: columna original -> columna nueva. Así una fórmula como
// =SUMA(I23:O23), cuya fila 23 pasó a ser la 4, se reescribe como =SUMA(I4:O4).
// Referencias con hoja explícita (Hoja!A1), nombres de función (LOG10) o que no
// se pueden mapear se dejan tal cual.
function remapFormula(formula, rowMap, colMap){
  if(typeof formula !== "string" || formula === "") return formula;
  return formula.replace(/(\$?)([A-Za-z]{1,3})(\$?)(\d+)/g, (match, dc, colL, dr, rowD, offset, full) => {
    const prev = offset > 0 ? full[offset - 1] : "";
    const next = full[offset + match.length] || "";
    // No tocar si es parte de un identificador, si tiene hoja explícita (…!A1),
    // o si va seguido de "(" (nombre de función / rango con nombre).
    if(/[A-Za-z0-9_.!$]/.test(prev)) return match;
    if(next === "(") return match;
    const newCol = colMap[colLetterToNum(colL)];
    const newRow = rowMap[parseInt(rowD, 10)];
    if(newCol === undefined || newRow === undefined) return match; // no mapeable -> se deja igual
    return dc + numToColLetter(newCol) + dr + newRow;
  });
}

function App(){
  const [fileName, setFileName] = useState(null);
  const [dragging, setDragging] = useState(false);
  const [workbook, setWorkbook] = useState(null);
  const [sheetName, setSheetName] = useState(null);
  const [headerRowCount, setHeaderRowCount] = useState(2);
  const [colIndex, setColIndex] = useState(null);
  const [rows, setRows] = useState(null);
  const [groups, setGroups] = useState(null);
  const [status, setStatus] = useState(null);
  const [busy, setBusy] = useState(false);
  const [reading, setReading] = useState(false);
  const [progress, setProgress] = useState(null); // {done, total}
  const [customName, setCustomName] = useState("");
  const [prefix, setPrefix] = useState("");
  const [previewName, setPreviewName] = useState("");
  const [previewRows, setPreviewRows] = useState(null);
  const [excludedCols, setExcludedCols] = useState(() => new Set()); // índices 0-based a NO incluir
  const [excludedGroups, setExcludedGroups] = useState(() => new Set()); // nombres de grupo a NO generar
  const [sheetIndex, setSheetIndex] = useState(0); // hoja del libro que se está dividiendo
  const [sheetList, setSheetList] = useState([]);  // [{name, state}] de todas las hojas
  const fileInput = useRef(null);

  function reset(){
    setFileName(null); setWorkbook(null); setSheetName(null);
    setColIndex(null); setRows(null); setGroups(null); setStatus(null);
    setHeaderRowCount(2); setCustomName(""); setPrefix("");
    setPreviewName(""); setPreviewRows(null); setProgress(null);
    setExcludedCols(new Set());
    setExcludedGroups(new Set());
    setSheetIndex(0); setSheetList([]);
  }

  function toggleColumn(idx){
    setExcludedCols(prev => {
      const next = new Set(prev);
      if(next.has(idx)) next.delete(idx); else next.add(idx);
      return next;
    });
  }

  function toggleGroup(name){
    setExcludedGroups(prev => {
      const next = new Set(prev);
      if(next.has(name)) next.delete(name); else next.add(name);
      return next;
    });
  }

  // Lee cada celda de una fila como valor plano (solo para detectar y agrupar).
  function rowValues(row, colCount){
    const vals = [];
    for(let c = 1; c <= colCount; c++){
      const cell = row.getCell(c);
      vals.push(cell.value === null || cell.value === undefined ? "" : cell.value);
    }
    return vals;
  }

  // Busca el encabezado y la columna de país/compañía en las primeras filas.
  function detectHeaderAndColumn(allRows, extraKeyword){
    const keywords = new Set(CANDIDATE_HEADERS.map(normalize));
    if(extraKeyword && extraKeyword.trim() !== "") keywords.add(normalize(extraKeyword));
    const searchLimit = Math.min(HEADER_SEARCH_LIMIT, allRows.length);
    for(let r = 0; r < searchLimit; r++){
      const row = allRows[r] || [];
      for(let c = 0; c < row.length; c++){
        if(keywords.has(normalize(row[c]))){
          return {headerRowIdx: r, col: c};
        }
      }
    }
    return {headerRowIdx: null, col: null};
  }

  // Lee una hoja concreta del libro: arma las filas, detecta encabezado y columna
  // y calcula los grupos. Se usa al abrir el archivo y al cambiar de hoja.
  function loadSheet(wb, idx){
    setSheetIndex(idx);
    setExcludedCols(new Set());
    const ws = wb.worksheets[idx];
    if(!ws){
      setSheetName(null); setRows(null); setGroups(null); setColIndex(null);
      setStatus({type: 'err', msg: 'Esa hoja no tiene datos.'});
      return;
    }
    setSheetName(ws.name);
    const colCount = ws.columnCount;
    const rowCount = ws.rowCount;
    if(!colCount || !rowCount || rowCount === 0){
      setRows(null); setGroups(null); setColIndex(null);
      setStatus({type: 'err', msg: 'Esa hoja está vacía: no encontré ni encabezados ni filas de datos. Probá con otra hoja.'});
      return;
    }
    const allRows = [];
    for(let r = 1; r <= rowCount; r++){
      allRows.push(rowValues(ws.getRow(r), colCount));
    }
    setRows(allRows);
    const {headerRowIdx, col} = detectHeaderAndColumn(allRows, "");
    const effHeaderRows = headerRowIdx !== null ? headerRowIdx + 1 : 2;
    setHeaderRowCount(effHeaderRows);
    if(col !== null){
      setColIndex(col);
      computeGroups(allRows, effHeaderRows, col);
    } else {
      setColIndex(null);
      setGroups(null);
      setStatus({type: 'err', msg: 'No pude detectar automáticamente la columna de país/compañía en esta hoja. Revisá la fila de encabezado y elegí la columna a mano en la lista.'});
    }
  }

  function onSheetChange(newIdx){
    setPreviewRows(null); setPreviewName("");
    loadSheet(workbook, Number(newIdx));
  }

  async function handleFile(file){
    if(!file) return;
    setStatus(null);
    setPreviewRows(null);
    setPreviewName("");

    if(!/\.xlsx$/i.test(file.name)){
      setStatus({type: 'err', msg: 'El archivo no es un Excel .xlsx. Guardá tu plan como “Libro de Excel (.xlsx)” y volvé a subirlo.'});
      return;
    }

    setExcludedCols(new Set());
    setReading(true);
    try{
      const buffer = await file.arrayBuffer();
      const wb = new ExcelJS.Workbook();
      try{
        await wb.xlsx.load(buffer);
      } catch(loadErr){
        console.error(loadErr);
        setStatus({type: 'err', msg: 'No pude abrir el archivo. Parece que no es un .xlsx válido o está dañado. Abrilo en Excel, guardalo de nuevo como .xlsx e intentá otra vez.'});
        return;
      }

      if(!wb.worksheets || wb.worksheets.length === 0){
        setStatus({type: 'err', msg: 'El archivo no tiene ninguna hoja con datos.'});
        return;
      }

      setWorkbook(wb);
      setFileName(file.name);
      setSheetList(wb.worksheets.map(s => ({name: s.name, state: s.state})));

      // Por defecto tomamos la primera hoja VISIBLE (la que la persona ve y usa),
      // no worksheets[0], que puede ser una hoja oculta con datos viejos.
      let defIdx = wb.worksheets.findIndex(s => s.state !== 'hidden' && s.state !== 'veryHidden');
      if(defIdx < 0) defIdx = 0;
      loadSheet(wb, defIdx);
    } catch(err){
      console.error(err);
      setStatus({type: 'err', msg: 'No pude leer el archivo. Verificá que sea un .xlsx válido.'});
    } finally {
      setReading(false);
    }
  }

  function computeGroups(allRows, headerRows, cIdx){
    const dataRows = allRows.slice(headerRows);
    if(dataRows.length === 0){
      setGroups(null);
      setStatus({type: 'err', msg: 'El archivo no tiene filas de datos debajo del encabezado. Revisá cuántas filas de encabezado tiene.'});
      return;
    }
    const counts = {};
    for(const row of dataRows){
      const val = displayValue(row[cIdx]).trim();
      if(val === "") continue;
      counts[val] = (counts[val] || 0) + 1;
    }
    const groupList = Object.entries(counts)
      .sort((a, b) => b[1] - a[1])
      .map(([name, count]) => ({name, count}));

    if(groupList.length === 0){
      setGroups(null);
      setStatus({type: 'err', msg: 'La columna que elegiste está vacía en todas las filas. Elegí otra columna que sí tenga el país o la compañía.'});
      return;
    }
    setGroups(groupList);
    setExcludedGroups(new Set());
    setPreviewRows(null);
    setPreviewName("");
    setStatus(null);
  }

  function onColumnChange(newIdx){
    setColIndex(newIdx);
    setPreviewRows(null);
    computeGroups(rows, headerRowCount, newIdx);
  }

  function onHeaderRowsChange(n){
    setHeaderRowCount(n);
    if(colIndex !== null) computeGroups(rows, n, colIndex);
  }

  function applyCustomName(){
    if(!rows) return;
    const {headerRowIdx, col} = detectHeaderAndColumn(rows, customName);
    if(col !== null){
      const effHeaderRows = headerRowIdx + 1;
      setHeaderRowCount(effHeaderRows);
      setColIndex(col);
      computeGroups(rows, effHeaderRows, col);
    } else {
      setStatus({type: 'err', msg: `No encontré ninguna columna llamada “${customName}”. Fijate que esté escrita igual que en el encabezado, o elegí la columna a mano en la lista.`});
    }
  }

  function showPreview(name){
    setPreviewName(name);
    if(!name){ setPreviewRows(null); return; }
    const dataRows = rows.slice(headerRowCount);
    const matches = [];
    for(const row of dataRows){
      if(displayValue(row[colIndex]).trim() === name){
        matches.push(row);
        if(matches.length >= 5) break;
      }
    }
    setPreviewRows(matches);
  }

  // Devuelve un valor de celda seguro para escribir en el archivo nuevo.
  // Las "fórmulas compartidas" (shared formulas) de Excel dependen de una celda
  // madre; al separar filas esa madre puede quedar afuera y romper la escritura.
  // Por eso las convertimos en una fórmula normal e independiente (ExcelJS ya la
  // traduce a la posición correcta), conservando la fórmula pero sin la dependencia.
  function safeCellValue(srcCell, rowMap, colMap){
    const v = srcCell.value;
    if(v && typeof v === "object" && (v.formula || v.sharedFormula)){
      let formulaText;
      try{ formulaText = srcCell.formula; } catch(e){ formulaText = undefined; }
      if(formulaText){
        // Remapeamos las referencias a la nueva ubicación de los datos, para que
        // p.ej. =SUMA(I23:O23) se reescriba como =SUMA(I4:O4) en el archivo separado.
        const remapped = (rowMap && colMap) ? remapFormula(formulaText, rowMap, colMap) : formulaText;
        return {formula: remapped, result: v.result};
      }
      // Si no se pudo recuperar el texto de la fórmula, usamos el valor calculado.
      return v.result !== undefined ? v.result : null;
    }
    return v;
  }

  // Copia una fila origen en una fila destino, celda por celda, conservando
  // value + style completo (fuente, relleno, bordes, alineación, numFmt) para
  // que fechas, moneda, colores y FÓRMULAS sobrevivan intactos.
  // keptCols: columnas del ORIGEN (1-based) que se conservan, en orden. La
  // posición en keptCols es la columna destino (1..N), así se recortan las
  // columnas destildadas y las demás se corren de lugar.
  function copyRowInto(srcRow, destRow, keptCols, rowMap, colMap){
    for(let d = 1; d <= keptCols.length; d++){
      const srcCell = srcRow.getCell(keptCols[d - 1]);
      const destCell = destRow.getCell(d);
      destCell.value = safeCellValue(srcCell, rowMap, colMap); // fórmula conservada y con referencias remapeadas
      destCell.style = srcCell.style;
    }
    if(srcRow.height) destRow.height = srcRow.height;
  }

  function sanitizeForFilename(str){
    return str.replace(/[\\\/:*?"<>|]/g, "-").replace(/\s+/g, " ").trim();
  }

  // Excel no admite nombres de hoja con estos caracteres, ni de más de 31
  // caracteres, ni vacíos. Si el archivo original tiene una hoja así, al crear
  // la hoja nueva la librería fallaría; por eso lo saneamos.
  function sanitizeSheetName(str){
    let s = (str || "").toString().replace(/[\\\/*?:\[\]]/g, " ").replace(/\s+/g, " ").trim();
    if(s.length > 31) s = s.slice(0, 31).trim();
    return s || "Hoja1";
  }

  async function generate(){
    if(!rows || colIndex === null || !groups || !workbook) return;
    const totalCols = workbook.worksheets[sheetIndex].columnCount;
    if(excludedCols.size >= totalCols){
      setStatus({type: 'err', msg: 'Sacaste todas las columnas. Dejá tildada al menos una para poder generar los archivos.'});
      return;
    }
    // Solo los grupos que quedaron tildados.
    const groupsToGen = groups.filter(g => !excludedGroups.has(g.name));
    if(groupsToGen.length === 0){
      setStatus({type: 'err', msg: 'Destildaste todos los grupos. Dejá tildado al menos uno para poder generar los archivos.'});
      return;
    }
    setBusy(true);
    setProgress({done: 0, total: groupsToGen.length});
    setStatus({type: 'info', msg: 'Generando archivos...'});
    try{
      const zip = new JSZip();
      const originalWs = workbook.worksheets[sheetIndex];
      const colCount = originalWs.columnCount;
      const baseName = fileName.replace(/\.xlsx$/i, '');
      const cleanPrefix = sanitizeForFilename(prefix);

      // Columnas del ORIGEN (1-based) que se conservan, en orden, según los
      // checkboxes. colMap: columna original -> columna nueva (para anchos y merges).
      const keptCols = [];
      const colMap = {};
      for(let c = 1; c <= colCount; c++){
        if(!excludedCols.has(c - 1)){
          keptCols.push(c);
          colMap[c] = keptCols.length;
        }
      }

      // Dado un rango de columnas del original, devuelve el rango destino de las
      // que se conservan (o null si ninguna quedó). Las columnas conservadas
      // dentro de un rango son contiguas en el destino, así que basta min/max.
      function mapMergeCols(left, right){
        let lo = null, hi = null;
        for(let c = left; c <= right; c++){
          if(colMap[c] !== undefined){
            if(lo === null) lo = colMap[c];
            hi = colMap[c];
          }
        }
        return lo === null ? null : {lo, hi};
      }

      // Celdas combinadas del archivo original, ya parseadas.
      let originalMerges = [];
      try{
        originalMerges = (originalWs.model && originalWs.model.merges ? originalWs.model.merges : [])
          .map(parseRange)
          .filter(Boolean);
      } catch(mErr){
        console.warn('No pude leer las celdas combinadas del original:', mErr);
      }

      for(let gi = 0; gi < groupsToGen.length; gi++){
        const g = groupsToGen[gi];
        const newWb = new ExcelJS.Workbook();
        const newWs = newWb.addWorksheet(sanitizeSheetName(sheetName));

        // Conservar anchos, solo de las columnas que quedan (protegido ante columnas sin definir).
        try{
          newWs.columns = keptCols.map(c => {
            const col = originalWs.getColumn(c);
            return {width: col && col.width ? col.width : undefined};
          });
        } catch(colErr){
          console.warn('No pude copiar los anchos de columna:', colErr);
        }

        // rowMap: fila original -> fila nueva (para remapear celdas combinadas
        // y referencias de fórmulas). Lo armamos COMPLETO antes de copiar, porque
        // una fórmula puede referenciar filas que se copian más abajo.
        const rowMap = {};
        const srcRowsInOrder = [];
        // Encabezado.
        for(let r = 1; r <= headerRowCount; r++){
          rowMap[r] = srcRowsInOrder.length + 1;
          srcRowsInOrder.push(r);
        }
        // Filas de datos que coinciden con este grupo.
        for(let r = headerRowCount + 1; r <= originalWs.rowCount; r++){
          const val = displayValue(rows[r - 1][colIndex]).trim();
          if(val === g.name){
            rowMap[r] = srcRowsInOrder.length + 1;
            srcRowsInOrder.push(r);
          }
        }
        // Ahora sí copiamos, con el rowMap/colMap ya completos.
        srcRowsInOrder.forEach((srcR, i) => {
          copyRowInto(originalWs.getRow(srcR), newWs.getRow(i + 1), keptCols, rowMap, colMap);
        });

        // Reaplicar celdas combinadas (remapeando filas y columnas conservadas).
        for(const m of originalMerges){
          try{
            const cols = mapMergeCols(m.left, m.right);
            if(!cols) continue; // el merge caía entero en columnas quitadas
            if(m.bottom <= headerRowCount){
              // Merge dentro del encabezado: filas iguales, columnas remapeadas.
              newWs.mergeCells(rangeStr(m.top, cols.lo, m.bottom, cols.hi));
            } else if(m.top > headerRowCount){
              // Merge dentro de los datos: solo si todas sus filas quedaron
              // en este grupo y siguen contiguas en el archivo nuevo.
              const newTop = rowMap[m.top];
              const newBottom = rowMap[m.bottom];
              if(newTop !== undefined && newBottom !== undefined &&
                 (newBottom - newTop) === (m.bottom - m.top)){
                newWs.mergeCells(rangeStr(newTop, cols.lo, newBottom, cols.hi));
              }
            }
            // Los merges que cruzan encabezado y datos se omiten (caso muy raro).
          } catch(mergeErr){
            // Si un merge se solapa o es inválido, lo salteamos sin romper todo.
            console.warn('No pude reaplicar una celda combinada:', mergeErr);
          }
        }

        const buf = await newWb.xlsx.writeBuffer();
        const namePart = sanitizeForFilename(g.name) || 'sin-valor';
        const outName = (cleanPrefix ? cleanPrefix + '_' : '') + baseName + '_' + namePart + '.xlsx';
        zip.file(outName, buf);

        setProgress({done: gi + 1, total: groupsToGen.length});
        // Cedemos el hilo para que la barra de progreso se actualice en pantalla.
        await new Promise(res => setTimeout(res, 0));
      }

      const content = await zip.generateAsync({type: 'blob'});
      const url = URL.createObjectURL(content);
      const a = document.createElement('a');
      a.href = url;
      const zipName = (cleanPrefix ? cleanPrefix + '_' : '') + baseName + '_dividido.zip';
      a.download = zipName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setStatus({type: 'ok', msg: `Listo. Se generaron ${groupsToGen.length} archivos, uno por cada valor de la columna, con el formato original. Se descargaron juntos en “${zipName}”.`});
    } catch(err){
      console.error(err);
      const detalle = err && err.message ? err.message : String(err);
      setStatus({type: 'err', msg: 'Ocurrió un error generando los archivos. Probá de nuevo; si sigue fallando, revisá que el archivo original se abra bien en Excel.', detail: detalle});
    } finally {
      setBusy(false);
      setProgress(null);
    }
  }

  const headerCandidates = rows ? (rows[headerRowCount - 1] || []) : [];
  const isLarge = rows ? (rows.length - headerRowCount) >= LARGE_FILE_THRESHOLD : false;
  const includedGroupCount = groups ? groups.filter(g => !excludedGroups.has(g.name)).length : 0;

  return (
    <div>
      <h1>Divisor de plan de compras</h1>
      <p className="subtitle">Subí el Excel y lo separa automáticamente en un archivo por país / compañía, con el mismo formato. Todo el procesamiento pasa en tu navegador: nada se sube a ningún servidor.</p>

      {!fileName && (
        <div
          className={"dropzone" + (dragging ? " drag" : "")}
          onClick={() => fileInput.current.click()}
          onDragOver={(e) => {e.preventDefault(); setDragging(true);}}
          onDragLeave={() => setDragging(false)}
          onDrop={(e) => {
            e.preventDefault();
            setDragging(false);
            const f = e.dataTransfer.files[0];
            handleFile(f);
          }}
        >
          {reading ? (
            <p className="main-label"><span className="spinner"></span>Leyendo el archivo...</p>
          ) : (
            <>
              <p className="main-label">Arrastrá el Excel acá, o hacé clic para elegirlo</p>
              <p className="sub-label">.xlsx — se procesa en tu navegador, no se sube a ningún servidor</p>
            </>
          )}
          <input
            ref={fileInput}
            type="file"
            accept=".xlsx"
            onChange={(e) => handleFile(e.target.files[0])}
          />
        </div>
      )}

      {!fileName && status && (
        <div className={status.type === 'err' ? 'warn-box' : 'status'}>{status.msg}</div>
      )}

      {fileName && (
        <div className="panel">
          <h2>📄 {fileName}</h2>

          {sheetList.length > 1 && (
            <>
              <div className="row">
                <span className="row-label">Hoja del Excel a dividir</span>
                <select value={sheetIndex} onChange={(e)=>onSheetChange(e.target.value)}>
                  {sheetList.map((s, i) => (
                    <option key={i} value={i}>
                      {s.name}{(s.state === 'hidden' || s.state === 'veryHidden') ? '  (oculta)' : ''}
                    </option>
                  ))}
                </select>
              </div>
              <div className="info-box">Este Excel tiene varias hojas. Reviso por defecto la primera <strong>visible</strong>; si querés dividir otra, elegila arriba.</div>
            </>
          )}

          <div className="row">
            <span className="row-label">Filas de encabezado</span>
            <select value={headerRowCount} onChange={(e)=>onHeaderRowsChange(Number(e.target.value))}>
              {[1,2,3,4,5,6].map(n => <option key={n} value={n}>{n}</option>)}
            </select>
          </div>

          <div className="row">
            <span className="row-label">Columna que identifica país / compañía</span>
            <select
              value={colIndex === null ? "" : colIndex}
              onChange={(e)=>onColumnChange(Number(e.target.value))}
            >
              <option value="" disabled>Elegir columna</option>
              {headerCandidates.map((h, idx) => (
                <option key={idx} value={idx}>{displayValue(h) || `Columna ${idx+1}`}</option>
              ))}
            </select>
          </div>

          <div className="field-group">
            <label className="fg-label">¿Tu columna se llama distinto? Escribí el nombre y buscala</label>
            <div style={{display:'flex', gap:'8px'}}>
              <input
                type="text"
                value={customName}
                placeholder="Ej: División, Región, Distribuidor…"
                onChange={(e)=>setCustomName(e.target.value)}
                onKeyDown={(e)=>{ if(e.key === 'Enter') applyCustomName(); }}
              />
              <button className="link-btn" onClick={applyCustomName}>Buscar</button>
            </div>
            <div className="fg-hint">Detecta sola: país, pais, compañía, filial, empresa, cliente, sucursal. Si tu columna tiene otro nombre, escribilo acá.</div>
          </div>

          <div className="field-group">
            <label className="fg-label">Prefijo para los nombres de archivo (opcional)</label>
            <input
              type="text"
              value={prefix}
              placeholder="Ej: Megalabs, Plan-Agosto…"
              onChange={(e)=>setPrefix(e.target.value)}
            />
            <div className="fg-hint">
              Se agrega al principio de cada archivo. Quedaría:&nbsp;
              <strong>{(sanitizeForFilename(prefix) ? sanitizeForFilename(prefix) + '_' : '') + (fileName ? fileName.replace(/\.xlsx$/i,'') : 'archivo') + '_' + (groups && groups[0] ? sanitizeForFilename(groups[0].name) : 'Compañía') + '.xlsx'}</strong>
            </div>
          </div>

          {isLarge && !busy && (
            <div className="info-box">Este archivo tiene muchas filas. Al generar puede tardar unos segundos; vas a ver una barra de progreso mientras trabaja.</div>
          )}

          {groups && (
            <>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginTop:'4px'}}>
                <span className="fg-label" style={{margin:0}}>Grupos a generar (destildá los que no querés, ej: totales)</span>
                <span style={{fontSize:'12px'}}>
                  <span className="mini-link" onClick={()=>setExcludedGroups(new Set())}>Todos</span>
                  <span style={{color:'var(--line)'}}> · </span>
                  <span className="mini-link" onClick={()=>setExcludedGroups(new Set(groups.map(g=>g.name)))}>Ninguno</span>
                </span>
              </div>
              <div className="table-scroll">
                <table>
                  <thead>
                    <tr><th style={{width:'34px'}}></th><th>Valor</th><th>Filas</th></tr>
                  </thead>
                  <tbody>
                    {groups.map(g => (
                      <tr key={g.name} className={excludedGroups.has(g.name) ? 'row-off' : ''}>
                        <td style={{textAlign:'center'}}>
                          <input
                            type="checkbox"
                            checked={!excludedGroups.has(g.name)}
                            onChange={()=>toggleGroup(g.name)}
                          />
                        </td>
                        <td>{g.name}</td>
                        <td><span className="pill">{g.count}</span></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              <div className="field-group" style={{marginTop:'12px'}}>
                <label className="fg-label">Columnas a incluir en los archivos</label>
                <div className="col-checks">
                  {headerCandidates.map((h, idx) => (
                    <label key={idx} className={"col-check" + (excludedCols.has(idx) ? " off" : "")}>
                      <input
                        type="checkbox"
                        checked={!excludedCols.has(idx)}
                        onChange={()=>toggleColumn(idx)}
                      />
                      <span>{displayValue(h) || `Columna ${idx+1}`}</span>
                    </label>
                  ))}
                </div>
                <div className="fg-hint">Destildá una columna para que <strong>no</strong> aparezca en los archivos generados. Se aplica a todos los archivos. La agrupación por país/compañía se hace igual, aunque destildes esa columna.</div>
                {excludedCols.size > 0 && (
                  <div className="fg-hint" style={{color:'var(--warn)'}}>
                    Ojo: si una columna que dejás usa una fórmula que apunta a una columna que sacaste, esa fórmula puede quedar rota (#REF!). Conviene revisar con “Ver detalle”.
                  </div>
                )}
              </div>

              <div className="field-group" style={{marginTop:'12px'}}>
                <label className="fg-label">Ver detalle (opcional): primeras 5 filas de un grupo</label>
                <select value={previewName} onChange={(e)=>showPreview(e.target.value)}>
                  <option value="">Elegir grupo para previsualizar…</option>
                  {groups.map(g => <option key={g.name} value={g.name}>{g.name} ({g.count} filas)</option>)}
                </select>
              </div>

              {previewRows && (
                <div className="preview-box">
                  <h3>Primeras {previewRows.length} filas de “{previewName}”</h3>
                  <div className="table-scroll">
                    <table>
                      <thead>
                        <tr>
                          {headerCandidates.map((h, idx) => (
                            excludedCols.has(idx) ? null :
                            <th key={idx}>{displayValue(h) || `Col ${idx+1}`}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {previewRows.map((r, ri) => (
                          <tr key={ri}>
                            {headerCandidates.map((h, ci) => (
                              excludedCols.has(ci) ? null :
                              <td key={ci}>{displayValue(r[ci])}</td>
                            ))}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              <button
                className="primary"
                disabled={busy || (headerCandidates.length > 0 && excludedCols.size >= headerCandidates.length) || includedGroupCount === 0}
                onClick={generate}
              >
                {busy ? "Generando..." : `Generar ${includedGroupCount} archivo${includedGroupCount === 1 ? '' : 's'} (.zip)`}
              </button>
            </>
          )}

          {progress && (
            <div className="progress-wrap">
              <div className="progress-track">
                <div className="progress-bar" style={{width: `${Math.round((progress.done/progress.total)*100)}%`}}></div>
              </div>
              <div className="progress-label">Generando archivo {progress.done} de {progress.total}…</div>
            </div>
          )}

          {status && (
            <div className={status.type === 'err' ? 'warn-box' : 'status ' + (status.type === 'ok' ? 'ok' : '')}>
              {status.msg}
              {status.detail && (
                <div style={{marginTop:'6px', fontSize:'11.5px', opacity:.75, wordBreak:'break-word'}}>
                  Detalle técnico (para reportar): {status.detail}
                </div>
              )}
            </div>
          )}

          <div className="reset-link" onClick={reset}>Cargar otro archivo</div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App/>);
</script>
</body>
</html>
